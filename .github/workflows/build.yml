name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Stamp build number
        shell: pwsh
        run: Set-Content -Path clarinet_tone/_build.py -Value "BUILD = ${{ github.run_number }}"
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name ClarinetTone --icon assets/clarinet.ico --add-data "assets/clarinet.ico;assets" run_app.py
      - name: Check the packaged program starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ClarinetTone.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:APPDATA\ClarinetTone\error.log" -ErrorAction SilentlyContinue; exit 1 }
          Get-Content "$env:APPDATA\ClarinetTone\selftest.txt"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Clarinet Tone Tracker, build ${{ github.run_number }}
          body: Download ClarinetTone.exe below and double-click it.
          files: dist/ClarinetTone.exe
          make_latest: true
